name: Build TV MOV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'TVMOV_Android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Unzip + Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify application archive
        shell: bash
        run: |
          set -euo pipefail
          test -f TVMOV_Android.zip
          unzip -t TVMOV_Android.zip >/dev/null
          echo "Archive OK"

      - name: Unzip application project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _tvmov_project
          mkdir -p _tvmov_project
          unzip -q TVMOV_Android.zip -d _tvmov_project
          PROJECT_DIR="$(find "$PWD/_tvmov_project" -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses </dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          echo "Android API 36 installed"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Show tool versions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          java -version
          gradle --version
          ls -la "$ANDROID_HOME/platforms/android-36"

      - name: Validate Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle tasks --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/TVMOV-debug.apk
          ls -lh artifacts/TVMOV-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TVMOV-debug-apk
          path: artifacts/TVMOV-debug.apk
          if-no-files-found: error
          retention-days: 14
